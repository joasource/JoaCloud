name: Build Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao da release (ex.: v1.0.0)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar versao da release
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar que APP_VERSION e CHANGELOG batem com a tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          GUI_VERSION=$(grep -oP '(?<=^APP_VERSION = ")[^"]+' joacloud/gui.py)
          if [ "$GUI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::APP_VERSION em joacloud/gui.py e '$GUI_VERSION', mas a tag publicada e 'v$TAG_VERSION'. Atualize APP_VERSION antes de fazer a tag."
            exit 1
          fi

          CHANGELOG_VERSION=$(grep -oP '(?<=^## \[)[^\]]+' CHANGELOG.md | head -n1)
          if [ "$CHANGELOG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::A primeira entrada do CHANGELOG.md e '$CHANGELOG_VERSION', mas a tag publicada e 'v$TAG_VERSION'. Adicione a secao '## [$TAG_VERSION] - AAAA-MM-DD' antes de fazer a tag."
            exit 1
          fi

          echo "Versao $TAG_VERSION confere em APP_VERSION e no CHANGELOG."

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r joacloud/requirements.txt
          pip install pyinstaller

      - name: Baixar e extrair GnuPG para embutir (sem executar instalador)
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Baixando binario w32 do GnuPG..."
          Invoke-WebRequest -Uri "https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.4.8_20250514.exe" -OutFile "$PWD\gnupg-w32.exe"
          Write-Host "Extraindo com 7-Zip (o instalador NUNCA e executado, so descompactado)..."
          7z x -y "$PWD\gnupg-w32.exe" -o"$PWD\gnupg-extracted" | Out-Null
          if (-not (Test-Path "$PWD\gnupg-extracted\bin\gpg.exe")) {
            Write-Error "gpg.exe nao foi encontrado apos a extracao"
            exit 1
          }
          Write-Host "Extracao concluida."
          New-Item -ItemType Directory -Force -Path "$PWD\gnupg-bin" | Out-Null
          Copy-Item -Path "$PWD\gnupg-extracted\bin\*" -Destination "$PWD\gnupg-bin" -Recurse -Force
          Write-Host "Copia para gnupg-bin concluida."

      - name: Compilar executavel Windows
        run: |
          pyinstaller --onefile --windowed --name JoaCloud `
            --icon "${{ github.workspace }}\packaging\windows\icon.ico" `
            --collect-data customtkinter `
            --collect-data docx `
            --add-binary "${{ github.workspace }}\gnupg-bin;gnupg-bin" `
            --add-data "${{ github.workspace }}\packaging\linux\icon.png;." `
            --distpath dist --workpath build --specpath build `
            joacloud/gui.py

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/JoaCloud.exe

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r joacloud/requirements.txt
          pip install pyinstaller

      - name: Compilar binario Linux
        run: |
          pyinstaller --onedir --windowed --name JoaCloud \
            --icon "${{ github.workspace }}/packaging/linux/icon.png" \
            --collect-data customtkinter \
            --collect-data docx \
            --add-data "${{ github.workspace }}/packaging/linux/icon.png:." \
            --distpath dist --workpath build --specpath build \
            joacloud/app.py

      - name: Montar AppDir
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp -r dist/JoaCloud AppDir/usr/bin/JoaCloud
          cp packaging/linux/JoaCloud.desktop AppDir/JoaCloud.desktop
          cp packaging/linux/icon.png AppDir/JoaCloud.png
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/JoaCloud/JoaCloud

      - name: Baixar appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Gerar AppImage
        run: |
          ./appimagetool --appimage-extract-and-run AppDir dist/JoaCloud-x86_64.AppImage

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/JoaCloud-x86_64.AppImage

  release:
    # Disparo manual (workflow_dispatch) so' gera os executaveis como
    # artefatos do Actions, pra teste: release publica so' com tag vX.Y.Z.
    if: github.event_name == 'push'
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: JoaCloud ${{ needs.version.outputs.version }}
          body: |
            Toolkit para baixar, verificar e descriptografar retorno de ofícios judiciais da Apple e do Google.

            Autor: Joaquim Ferreira Silva Neto — joaquimfsneto@gmail.com
          generate_release_notes: true
          files: |
            artifacts/windows-exe/JoaCloud.exe
            artifacts/linux-appimage/JoaCloud-x86_64.AppImage
